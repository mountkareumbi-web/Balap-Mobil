<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Split-Screen Racing - Satu Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Menu Utama / Pemilihan Mode -->
    <div id="menu-screen" class="screen">
        <h1>🏁 2D SPLIT-SCREEN RACING 🏁</h1>
        <p>Pilih mode perangkat Anda:</p>
        <div class="menu-buttons">
            <button id="btn-display" class="btn primary">📺 Buka Layar Utama (Display TV/Laptop)</button>
            <button id="btn-controller" class="btn secondary">📱 Gunakan Sebagai Stik Kontrol (HP)</button>
        </div>
    </div>

    <!-- Layar Utama Permainan (Split-Screen) -->
    <div id="display-screen" class="screen hidden">
        <div class="split-container">
            <!-- Tampilan Kamera Player 1 -->
            <div class="player-view">
                <div class="hud">P1: <span id="hud-name-1">Player 1</span> | Lap: <span id="hud-lap-1">1/3</span></div>
                <canvas id="canvas-p1"></canvas>
            </div>
            <div class="split-divider"></div>
            <!-- Tampilan Kamera Player 2 -->
            <div class="player-view">
                <div class="hud">P2: <span id="hud-name-2">Player 2</span> | Lap: <span id="hud-lap-2">1/3</span></div>
                <canvas id="canvas-p2"></canvas>
            </div>
        </div>
    </div>

    <!-- Layar Stik Kontroler HP -->
    <div id="controller-screen" class="screen hidden">
        <div id="login-container">
            <h2>Pilih Slot Stik</h2>
            <input type="text" id="player-name" placeholder="Nama Pembalap" maxlength="10">
            <div class="slot-buttons">
                <button class="btn slot-btn" data-slot="1">Gabung Sebagai Player 1</button>
                <button class="btn slot-btn" data-slot="2">Gabung Sebagai Player 2</button>
            </div>
        </div>
        
        <div id="joystick-container" class="hidden">
            <h3 id="controller-title">Stik Aktif</h3>
            <div class="controls-pad">
                <button id="btn-up" class="ctrl-btn">▲ GAS</button>
                <div class="horizontal-controls">
                    <button id="btn-left" class="ctrl-btn">◀ KIRI</button>
                    <button id="btn-right" class="ctrl-btn">KANAN ▶</button>
                </div>
                <button id="btn-down" class="ctrl-btn">▼ REM / MUNDUR</button>
            </div>
        </div>
    </div>

    <script src="display.js"></script>
    <script src="controller.js"></script>
</body>
</html>
