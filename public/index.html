<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Multiplayer Racing</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. LAYAR MENU UTAMA -->
    <div id="menu-screen" class="screen active">
        <h1>🏎️ 2D TURBO RACING</h1>
        <p>Pilih peran perangkat ini:</p>
        <div class="menu-buttons">
            <button id="btn-display" class="btn primary">🖥️ Buka Display (Layar Utama)</button>
            <button id="btn-p1" class="btn p1-color">🎮 Pakai Stik 1</button>
            <button id="btn-p2" class="btn p2-color">🎮 Pakai Stik 2</button>
        </div>
        <p id="error-msg" class="error"></p>
    </div>

    <!-- 2. LAYAR INPUT NAMA PEMAIN (UNTUK STIK) -->
    <div id="name-screen" class="screen">
        <h2 id="selected-stick-title">Setup Stik</h2>
        <input type="text" id="player-name-input" placeholder="Masukkan Nama Kamu..." maxlength="12">
        <button id="btn-confirm-name" class="btn primary">Mulai Balapan!</button>
    </div>

    <!-- 3. LAYAR DISPLAY UTAMA (PC / TV / TABLET) -->
    <div id="display-screen" class="screen">
        <div class="hud-top">
            <div id="p1-hud" class="hud-box p1-border">Stik 1: Menunggu...</div>
            <div id="race-status">Menunggu Pemain...</div>
            <div id="p2-hud" class="hud-box p2-border">Stik 2: Menunggu...</div>
        </div>
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
        <div id="winner-overlay" class="hidden">
            <h1 id="winner-text">PEMENANG!</h1>
            <button id="btn-restart" class="btn primary">Main Lagi</button>
        </div>
    </div>

    <!-- 4. LAYAR STIK KONTROLER (HP LANDSCAPE) -->
    <div id="controller-screen" class="screen">
        <div class="rotate-warning">🔄 Putar HP kamu ke posisi <b>Landscape (Miring)</b>!</div>
        <div class="gamepad-container">
            <div class="gamepad-header">
                <span id="ctrl-player-info">Player</span>
                <span id="nitro-bar-container">NITRO: <progress id="nitro-bar" value="100" max="100"></progress></span>
            </div>
            <div class="gamepad-body">
                <!-- Kiri: Setir Kiri & Kanan -->
                <div class="pad-left">
                    <button class="ctrl-btn steer" data-key="left">◀</button>
                    <button class="ctrl-btn steer" data-key="right">▶</button>
                </div>
                <!-- Tengah: Klakson / Reset posisi -->
                <div class="pad-center">
                    <button class="ctrl-btn small" data-key="horn">📯 KLAKSON</button>
                </div>
                <!-- Kanan: Rem, Nitro, Gas -->
                <div class="pad-right">
                    <button class="ctrl-btn brake" data-key="brake">REM</button>
                    <button class="ctrl-btn nitro" data-key="nitro">🔥 NOS</button>
                    <button class="ctrl-btn gas" data-key="gas">GAS</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="display.js"></script>
    <script src="controller.js"></script>
</body>
</html>
